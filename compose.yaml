# docker compose up -d   →   http://localhost:3131
services:
  varatlas:
    image: ghcr.io/scenr-io/varatlas:latest
    restart: unless-stopped
    # Published on localhost only: varatlas has no login of its own (see README → Security model).
    ports:
      - "127.0.0.1:3131:3131"
    environment:
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      VARATLAS_EXCLUDE_PATHS: ${VARATLAS_EXCLUDE_PATHS:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
